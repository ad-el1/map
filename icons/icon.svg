<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <rect width="192" height="192" rx="32" fill="#2563eb"/>
  <!-- Graduation cap -->
  <g transform="translate(96,96)">
    <!-- Cap board -->
    <polygon points="0,-38 52,0 0,20 -52,0" fill="white" opacity="0.95"/>
    <!-- Cap top tassel knob -->
    <circle cx="0" cy="-38" r="6" fill="white"/>
    <!-- Left side hanging -->
    <path d="M-52,0 L-52,28 Q-44,40 -36,36 Q-28,32 -28,24 L-28,8" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Right side pillar -->
    <rect x="44" y="0" width="6" height="28" rx="3" fill="white" opacity="0.8"/>
    <!-- Location pin below -->
    <circle cx="0" cy="62" r="14" fill="white" opacity="0.9"/>
    <polygon points="0,82 -10,62 10,62" fill="white" opacity="0.9"/>
    <circle cx="0" cy="62" r="6" fill="#2563eb"/>
  </g>
</svg>
